# Your P2 settings. Every p2 command reads this file.
# p2 check regenerates your committed runs with these values, so after you change one,
# run `uv run p2 run --all` and `uv run p2 score` again and commit what they write.
# You can add tables of your own (for example [dense] model = "...") and read them in your
# retrievers with cfg.table("dense").

# "498E" or "598E"; 598E switches on the checks for the rider.
section = "598E"

[run]
# How many documents each query keeps in a run file.
k = 10

[chunking]
# Words per chunk, and words shared by neighboring chunks.
# 0 words keeps every document whole as one chunk.
words = 300
overlap = 50

[bm25]
# "codes" keeps codes such as 75.403 or syn-4127 whole and also indexes their parts.
# "lab" is the plain [a-z0-9]+ tokenizer from the 12 lab.
tokenizer = "codes"
k1 = 0.9
b = 0.4

[dense]
# The embedding model, by Hugging Face name. embed.BGE is "BAAI/bge-small-en-v1.5" (the default);
# the other model of the 12 lab is "minishlab/potion-retrieval-32M".
# Chunk vectors are cached in .cache/vectors/ per model, so changing this re-encodes every chunk once.
model = "BAAI/bge-small-en-v1.5"
# Text put in front of every query before it is embedded (documents get none).
# Empty here; some models are trained with an instruction before the query.
query_prefix = ""

[hybrid]
# The constant of reciprocal rank fusion: an item at rank r adds 1 / (rrf_k + r) to its score.
# 60 is the value of the 13 lab; the fused systems are bm25 and dense.
rrf_k = 60

[rerank]
# The system whose top candidates Claude reorders (hybrid, dense or bm25), and how many it reorders.
first_stage = "hybrid"
candidates = 20
# Each candidate is cut to this many characters before Claude sees it (a 300-word chunk is about 2,000
# characters on the shared corpus and up to about 2,500 on the NRC notices).
passage_chars = 2500
# What a document is shown as: "chunk" (its best chunk for the query) or "doc" (the start of the document).
passage = "chunk"

[answer]
# How many chunks `p2 answer` sends to Claude with each question.
top = 5

[claude]
# The model for every claude -p call (the reranker and the answers).
model = "sonnet"
